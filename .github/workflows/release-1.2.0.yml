name: Release 1.2.0 — Stage 3 ChatGPT Voice handoff compatibility

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check whether this release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.2.0
          APK_NAME: Android-Wake-Phrase-Service-1.2.0.apk
        run: |
          if release_json=$(gh release view "$TAG" --json assets 2>/dev/null); then
            if echo "$release_json" | jq -e --arg name "$APK_NAME" '.assets | any(.name == $name)' >/dev/null; then
              echo "Release $TAG already exists with its expected APK; leaving it unchanged."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Release $TAG already exists but is missing $APK_NAME. Refusing to overwrite or repair it automatically."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.existing.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and test debug APK
        if: steps.existing.outputs.skip != 'true'
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Prepare release files
        if: steps.existing.outputs.skip != 'true'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Android-Wake-Phrase-Service-1.2.0.apk
          printf '%s\n' \
            'Stage 3 — Android Wake Phrase Service 1.2.0 (ChatGPT Voice handoff compatibility test)' \
            '' \
            'Wake phrase: Hey Jarvis (on-device openWakeWord model), threshold 0.35.' \
            'Preserves Stage 2 START_STICKY behavior and the persistent notification Stop action.' \
            'Adds in-app guidance for ChatGPT Settings > Voice > Start with Voice.' \
            'The detection notification still requires a user tap to open ChatGPT. This app does not force Voice mode or launch ChatGPT hands-free.' \
            'Physical-device Voice-mode behavior must be tested by the owner; CI build success does not verify it.' \
            '' \
            'This APK is debug-signed for sideloading/testing, not a Play Store production build.' \
            'The bundled pretrained wake-word model is CC BY-NC-SA 4.0; this project is for non-commercial use.' > RELEASE_NOTES.md

      - name: Publish immutable versioned GitHub Release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.2.0
        run: |
          gh release create "$TAG" \
            Android-Wake-Phrase-Service-1.2.0.apk \
            --title "Android Wake Phrase Service 1.2.0 — Stage 3 Voice Handoff Test" \
            --notes-file RELEASE_NOTES.md
