name: Release 1.4.1 — Wake detector diagnostics and audio reliability

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check whether this release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.4.1
          APK_NAME: Android-Wake-Phrase-Service-1.4.1.apk
        run: |
          if release_json=$(gh release view "$TAG" --json assets 2>/dev/null); then
            if echo "$release_json" | jq -e --arg name "$APK_NAME" '.assets | any(.name == $name)' >/dev/null; then
              echo "Release $TAG already exists with its expected APK; leaving it unchanged."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Release $TAG already exists but is missing $APK_NAME. Refusing to overwrite or repair it automatically."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.existing.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and test debug APK
        if: steps.existing.outputs.skip != 'true'
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Prepare release files
        if: steps.existing.outputs.skip != 'true'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Android-Wake-Phrase-Service-1.4.1.apk
          cat > RELEASE_NOTES.md <<'EOF'
          Wake Phrase Service 1.4.1 — detector diagnostics and audio reliability test

          Wake phrase: yo, Ai Overlord (custom on-device ONNX model).
          Adds live model-load, microphone-recording, audio-frame, inference-count, and confidence-score diagnostics.
          Reports detector startup and audio capture failures instead of silently leaving a listening notification active.
          A successful CI build does not verify microphone capture or wake-word recognition on a physical phone.
          This APK is debug-signed for sideloading/testing, not a Play Store production build.
          The custom wake-word model is experimental; physical-device testing is required.
          EOF

      - name: Publish immutable versioned GitHub Release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.4.1
        run: |
          gh release create "$TAG" Android-Wake-Phrase-Service-1.4.1.apk --title "Android Wake Phrase Service 1.4.1 — Audio Diagnostics Test" --notes-file RELEASE_NOTES.md
